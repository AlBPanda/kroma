<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Güvenli, minimalist ve koyu mod görsel galerisi.">
  <meta name="theme-color" content="#09090b">
  
  <!-- Security Headers (Client-side fallback) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">

  <title>KROMA — Minimalist Koyu Mod Galeri</title>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="site-header">
    <div class="header-container">
      <a href="#" class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">KROMA</span>
      </a>

      <!-- Search & Filter Bar -->
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Kullanıcı adı ara..." autocomplete="off">
        <button id="clearSearch" class="clear-btn" aria-label="Aramayı Temizle" style="display: none;">&times;</button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Gallery Grid -->
    <div class="gallery-grid" id="galleryGrid">
      <!-- Dynamic cards will be rendered here by app.js -->
    </div>

    <!-- Empty State (No results) -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <h3>Sonuç Bulunamadı</h3>
      <p>Aramanıza uygun herhangi bir kullanıcı eşleşmedi.</p>
    </div>
  </main>

  <!-- Fullscreen Lightbox Modal -->
  <div class="lightbox-modal" id="lightboxModal" role="dialog" aria-hidden="true">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    
    <div class="lightbox-container">
      <!-- Close Button -->
      <button class="lightbox-close" id="lightboxClose" aria-label="Kapat">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <!-- Lightbox Image Wrapper -->
      <div class="lightbox-image-wrap">
        <img id="lightboxImage" src="" alt="" class="lightbox-img">
      </div>

      <!-- Lightbox Meta Info Footer -->
      <div class="lightbox-info">
        <div class="lightbox-user-group">
          <div class="user-avatar">
            <span id="userInitial">U</span>
          </div>
          <div class="user-details">
            <span class="user-handle" id="lightboxUsername">@kullaniciadi</span>
          </div>
          <div id="lightboxSiteBadge" class="site-badge"></div>
        </div>

        <!-- Lightbox Actions -->
        <div class="lightbox-actions">
          <button class="action-btn" id="copyLinkBtn" title="Bağlantıyı Kopyala">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <span id="copyBtnText">Kopyala</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
